<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 · 汽车租赁管理系统</title>
    <link rel="stylesheet" href="/stylesheets/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand">🚗 <span>汽车租赁管理系统</span></div>
      <nav>
        <a href="/" class="active">首页</a>
        <a href="/cars.html">车辆管理</a>
        <a href="/customers.html">客户管理</a>
        <a href="/rentals.html">租赁管理</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>概览</h1>
          <div class="sub">车辆、客户与租赁业务的实时统计</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="num" id="carTotal">—</div><div class="label">车辆总数</div></div>
        <div class="stat green"><div class="num" id="carAvailable">—</div><div class="label">可用车辆</div></div>
        <div class="stat amber"><div class="num" id="carRented">—</div><div class="label">已租出</div></div>
        <div class="stat purple"><div class="num" id="carMaintaining">—</div><div class="label">维护中</div></div>
        <div class="stat"><div class="num" id="customerTotal">—</div><div class="label">客户总数</div></div>
        <div class="stat red"><div class="num" id="rentalTotal">—</div><div class="label">租赁总数</div></div>
        <div class="stat green"><div class="num" id="rentalOngoing">—</div><div class="label">进行中</div></div>
        <div class="stat"><div class="num" id="rentalCompleted">—</div><div class="label">已完成</div></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="page-header" style="margin-bottom: 10px">
            <h1 style="font-size: 16px">最近车辆</h1>
            <a href="/cars.html" class="btn btn-sm">全部车辆 →</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>ID</th><th>车牌号</th><th>品牌</th><th>日租金</th><th>状态</th></tr>
              </thead>
              <tbody id="recent-cars"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="page-header" style="margin-bottom: 10px">
            <h1 style="font-size: 16px">最近租赁</h1>
            <a href="/rentals.html" class="btn btn-sm">全部租赁 →</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>ID</th><th>车辆</th><th>客户</th><th>费用</th><th>状态</th></tr>
              </thead>
              <tbody id="recent-rentals"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script>
      const CAR_STATUS = { AVAILABLE: '可用', RENTED: '已租出', MAINTAINING: '维护中' };
      const RENTAL_STATUS = { ONGOING: '进行中', COMPLETED: '已完成' };

      function badge(label, key) {
        return `<span class="badge badge-${key.toLowerCase()}">${label}</span>`;
      }

      async function loadStats() {
        const [cars, customers, rentals] = await Promise.all([
          api('/cars?pageSize=1'),
          api('/customers?pageSize=1'),
          api('/rentals?pageSize=1'),
        ]);
        const [avail, rented, maint, ongoing] = await Promise.all([
          api('/cars?pageSize=1&status=AVAILABLE'),
          api('/cars?pageSize=1&status=RENTED'),
          api('/cars?pageSize=1&status=MAINTAINING'),
          api('/rentals?pageSize=1&status=ONGOING'),
        ]);
        fill('#carTotal', cars.pagination.total);
        fill('#carAvailable', avail.pagination.total);
        fill('#carRented', rented.pagination.total);
        fill('#carMaintaining', maint.pagination.total);
        fill('#customerTotal', customers.pagination.total);
        fill('#rentalTotal', rentals.pagination.total);
        fill('#rentalOngoing', ongoing.pagination.total);
        fill('#rentalCompleted', rentals.pagination.total - ongoing.pagination.total);
      }

      function renderRecentCars(list) {
        const box = document.getElementById('recent-cars');
        if (!list.length) {
          box.innerHTML = '<tr><td colspan="5" class="empty">暂无数据</td></tr>';
          return;
        }
        box.innerHTML = list
          .map(
            (c) => `<tr>
              <td>${c.id}</td>
              <td>${esc(c.licensePlate)}</td>
              <td>${esc(c.brand)}</td>
              <td>${fmtMoney(c.dailyRate)}</td>
              <td>${badge(CAR_STATUS[c.status] || c.status, c.status)}</td>
            </tr>`,
          )
          .join('');
      }

      function renderRecentRentals(list) {
        const box = document.getElementById('recent-rentals');
        if (!list.length) {
          box.innerHTML = '<tr><td colspan="5" class="empty">暂无数据</td></tr>';
          return;
        }
        box.innerHTML = list
          .map(
            (r) => `<tr>
              <td>${r.id}</td>
              <td>${esc(r.car ? r.car.licensePlate : `#${r.carId}`)}</td>
              <td>${esc(r.customer ? r.customer.name : `#${r.customerId}`)}</td>
              <td>${fmtMoney(r.totalCost)}</td>
              <td>${badge(RENTAL_STATUS[r.status] || r.status, r.status)}</td>
            </tr>`,
          )
          .join('');
      }

      async function init() {
        try {
          await loadStats();
        } catch (e) {
          toast(e.message, 'error');
        }
        try {
          const cars = await api('/cars?pageSize=5');
          renderRecentCars(cars.cars);
        } catch (e) {
          document.getElementById('recent-cars').innerHTML =
            `<tr><td colspan="5" class="empty">加载失败</td></tr>`;
        }
        try {
          const rentals = await api('/rentals?pageSize=5');
          renderRecentRentals(rentals.rentals);
        } catch (e) {
          document.getElementById('recent-rentals').innerHTML =
            `<tr><td colspan="5" class="empty">加载失败</td></tr>`;
        }
      }

      init();
    </script>
  </body>
</html>
